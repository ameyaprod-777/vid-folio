<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMEYA CORP — Société de production</title>
  <meta name="description" content="AMEYA CORP, société de production audiovisuelle. Clips, publicité et contenus. Réalisation, image et direction artistique.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #000;
      --white: #FFF;
      --light: #E6E6E6;
      --dim: #A0A0A0;
      --pad: clamp(18px, 2.6vw, 32px);
      --ease: cubic-bezier(.65, 0, .15, 1);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body {
      background: var(--black);
      color: var(--light);
      font-family: "Archivo", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    ::selection { background: var(--white); color: var(--black); }

    button { font-family: inherit; }

    a { color: inherit; }

    img { display: block; }

    /* Titres étirés et labels de menu */
    .wide {
      font-stretch: 125%;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .01em;
    }

    .small {
      font-size: 11px;
      font-stretch: 115%;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    /* Grain de pellicule qui vibre */
    .grain {
      position: fixed;
      inset: -50%;
      pointer-events: none;
      z-index: 90;
      opacity: .09;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      animation: grain .8s steps(3) infinite;
    }

    @keyframes grain {
      0% { transform: translate(0, 0); }
      33% { transform: translate(-2%, 1.5%); }
      66% { transform: translate(1.5%, -2%); }
      100% { transform: translate(-1%, 2%); }
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 60;
      padding: 22px var(--pad);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      pointer-events: none;
    }

    header a,
    header button { pointer-events: auto; }

    .logo img { height: 48px; width: auto; }

    #nav {
      display: flex;
      gap: 28px;
      align-items: center;
    }

    .head-right {
      justify-self: end;
      display: flex;
      align-items: center;
    }

    header a,
    .menu-btn {
      color: var(--dim);
      text-decoration: none;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      transition: color .3s var(--ease);
    }

    header a:hover,
    header a.active,
    .menu-btn:hover { color: var(--white); }

    .menu-btn {
      display: none;
      width: 26px;
      height: 16px;
      flex-direction: column;
      justify-content: space-between;
      color: var(--white);
    }

    .menu-btn span {
      display: block;
      width: 100%;
      height: 1.5px;
      background: currentColor;
    }

    /* Menu mobile */
    #overlay {
      position: fixed;
      inset: 0;
      background: var(--black);
      z-index: 70;
      display: none;
      flex-direction: column;
      justify-content: center;
      padding: 22px var(--pad);
      gap: 6px;
    }

    #overlay.open { display: flex; }

    #overlay .close {
      position: absolute;
      top: 22px;
      right: var(--pad);
      background: none;
      border: 0;
      color: var(--white);
      cursor: pointer;
    }

    #overlay-nav {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #overlay a {
      display: block;
      color: var(--white);
      text-decoration: none;
      font-stretch: 125%;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .01em;
      font-size: clamp(34px, 10vw, 60px);
      line-height: 1.05;
    }

    /* Pages : une seule visible */
    .view { display: none; }

    .view.active {
      display: block;
      animation: view-in .7s var(--ease);
    }

    @keyframes view-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Visuel provisoire : trois halos gris */
    .ph {
      position: absolute;
      inset: 0;
      background: #050505;
      overflow: hidden;
    }

    .ph span {
      position: absolute;
      width: 78%;
      height: 78%;
      border-radius: 50%;
      mix-blend-mode: screen;
      animation: drift 18s var(--ease) infinite alternate;
    }

    .ph span:nth-child(1) { background: radial-gradient(circle, #c4c4c4 0%, transparent 68%); }
    .ph span:nth-child(2) { background: radial-gradient(circle, #8d8d8d 0%, transparent 70%); }
    .ph span:nth-child(3) { background: radial-gradient(circle, #e8e8e8 0%, transparent 64%); }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(var(--dx, 12px), var(--dy, -10px)) scale(1.12); }
    }

    /* Accueil : diaporama plein écran */
    #home {
      position: fixed;
      inset: 0;
      background: var(--black);
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      z-index: 0;
      pointer-events: none;
      cursor: pointer;
      transition: opacity 1.1s var(--ease);
    }

    .slide.on {
      opacity: 1;
      z-index: 1;
      pointer-events: auto;
    }

    .slide video,
    .slide iframe,
    .bg iframe,
    .hero iframe,
    .tile iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      object-fit: cover;
    }

    .slide iframe,
    .bg iframe,
    .hero iframe,
    .tile iframe { pointer-events: none; }

    .slide::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, .35), transparent 22%, transparent 60%, rgba(0, 0, 0, .55));
      pointer-events: none;
    }

    .caption {
      position: absolute;
      right: var(--pad);
      bottom: 40px;
      z-index: 5;
      text-align: right;
      pointer-events: none;
      margin: 0;
    }

    .caption .line {
      display: block;
      overflow: hidden;
    }

    .caption .line > span {
      display: inline-block;
      transform: translateY(110%);
      transition: transform .9s var(--ease);
    }

    .caption.show .line:nth-child(1) > span { transform: translateY(0); transition-delay: 0s; }
    .caption.show .line:nth-child(2) > span { transform: translateY(0); transition-delay: .08s; }
    .caption.show .line:nth-child(3) > span { transform: translateY(0); transition-delay: .16s; }

    #cap-client,
    #cap-sub { font-size: clamp(20px, 2.3vw, 30px); }

    #cap-sub { font-weight: 500; }

    #cap-credit { opacity: .75; }

    .progress {
      position: absolute;
      left: var(--pad);
      right: var(--pad);
      bottom: 22px;
      z-index: 6;
      display: flex;
      gap: 7px;
      height: 2px;
      pointer-events: none;
    }

    .progress span {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: rgba(255, 255, 255, .22);
    }

    .progress span::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0;
      background: var(--white);
    }

    .progress span.done::after { width: 100%; }
    .progress span.on::after { width: var(--p, 0%); }

    /* Compteur : codé, masqué. Passer en display:flex pour l'afficher. */
    .counter {
      display: none;
      position: absolute;
      left: var(--pad);
      bottom: 28px;
      z-index: 6;
      gap: 16px;
    }

    .counter button {
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      font-stretch: 125%;
      font-weight: 700;
      letter-spacing: .01em;
      color: rgba(244, 244, 242, .32);
      transition: color .3s var(--ease);
    }

    .counter button.on,
    .counter button:hover { color: var(--white); }

    /* Lecteur */
    #player {
      position: fixed;
      inset: 0;
      background: var(--black);
      z-index: 80;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .5s var(--ease), visibility .5s var(--ease);
    }

    #player.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #player .close {
      position: absolute;
      top: 22px;
      right: var(--pad);
      z-index: 2;
      background: none;
      border: 0;
      color: var(--white);
      cursor: pointer;
    }

    .screen {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(92vw, 160vh);
      aspect-ratio: 16 / 9;
      background: var(--black);
      overflow: hidden;
    }

    .screen video,
    .screen iframe {
      width: 100%;
      height: 100%;
      border: 0;
      object-fit: contain;
    }

    /* Téléphone : la version 9:16 occupe tout l'écran, sans bande 16:9. */
    @media (max-width: 860px) {
      .screen.is-portrait {
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        aspect-ratio: auto;
        transform: none;
      }

      .screen.is-portrait iframe { object-fit: cover; }
    }

    .player-meta {
      position: absolute;
      left: var(--pad);
      bottom: 28px;
      margin: 0;
    }

    .player-title {
      margin: 0 0 8px;
      font-weight: 700;
      font-size: 22px;
    }

    .player-sub { margin: 0; color: var(--dim); }

    .player-sub a { color: var(--light); text-decoration: none; }
    .player-sub a:hover { color: var(--white); }

    /* Catégories */
    .cat { min-height: 100vh; background: var(--black); }

    .backs { position: fixed; inset: 0; z-index: 0; }

    .bg {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity .8s var(--ease);
      filter: blur(18px) brightness(.55);
      transform: scale(1.1);
    }

    .bg.on { opacity: 1; }

    .bg video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cat-inner {
      position: relative;
      z-index: 2;
      max-width: 1000px;
      margin: 0 auto;
      padding: clamp(140px, 28vh, 290px) var(--pad) 80px;
    }

    .cat-inner > .small { color: var(--dim); margin: 0 0 22px; }

    .year-block + .year-block { margin-top: 42px; }

    .year-label {
      margin: 0 0 16px;
      color: var(--white);
      font-size: clamp(28px, 4vw, 52px);
      line-height: .9;
    }

    .names {
      columns: 3;
      column-gap: 32px;
    }

    .names a {
      display: block;
      break-inside: avoid;
      color: var(--white);
      text-decoration: none;
      text-transform: uppercase;
      font-stretch: 125%;
      font-weight: 700;
      font-size: clamp(12px, 1.1vw, 14px);
      line-height: 1.6;
      letter-spacing: .01em;
      transition: opacity .3s var(--ease);
    }

    .names:hover a { opacity: .4; }
    .names a:hover { opacity: 1; }

    .names.split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 32px;
      align-items: start;
    }

    .names.split a:first-child { grid-column: 1; grid-row: 1; }
    .names.split a:nth-child(2) { grid-column: 2; grid-row: 1; }
    .names.split a:nth-child(3) { grid-column: 2; grid-row: 2; }

    /* Lettres qui roulent */
    .roll { display: inline; }
    .word { display: inline-block; white-space: nowrap; }
    .word + .word { margin-left: .3em; }
    .name-sep { margin-inline: .35em; }

    .ch {
      display: inline-block;
      overflow: hidden;
      height: 1.15em;
      line-height: 1.15em;
      vertical-align: bottom;
    }

    .ch > span {
      display: block;
      position: relative;
      transition: transform .45s var(--ease);
    }

    .ch > span::after {
      content: attr(data-c);
      position: absolute;
      left: 0;
      top: 100%;
    }

    a:hover .ch > span { transform: translateY(-100%); }

    /* Page réalisateur */
    .dir-name {
      position: fixed;
      top: 66px;
      left: var(--pad);
      z-index: 5;
      margin: 0;
      font-size: clamp(28px, 4vw, 64px);
      pointer-events: none;
    }

    .hero {
      position: relative;
      height: 100vh;
      cursor: pointer;
      overflow: hidden;
    }

    .hero video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 8px;
      background: var(--black);
    }

    .tile {
      position: relative;
      aspect-ratio: 16 / 11;
      overflow: hidden;
      cursor: pointer;
      background: #111;
    }

    .tile.wide-tile {
      grid-column: 1 / -1;
      aspect-ratio: 21 / 9;
    }

    .tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 1.2s var(--ease);
    }

    .tile::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, .35);
      opacity: 0;
      transition: opacity .5s var(--ease);
    }

    .tile .meta {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 2;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .6s var(--ease), transform .6s var(--ease);
    }

    .tile .meta strong,
    .tile .meta span {
      display: block;
      text-transform: uppercase;
      font-stretch: 125%;
      letter-spacing: .01em;
    }

    .tile .meta strong { font-weight: 800; font-size: 14px; }
    .tile .meta span { font-weight: 500; font-size: 13px; margin-top: 4px; }

    .tile:hover video,
    .tile:hover .ph { transform: scale(1.05); }
    .tile:hover::after { opacity: 1; }
    .tile:hover .meta { opacity: 1; transform: translateY(0); }

    .ph { transition: transform 1.2s var(--ease); }

    /* About */
    .about-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: clamp(110px, 16vh, 160px) var(--pad) 80px;
    }

    .about-logo {
      width: clamp(128px, 16vw, 220px);
      height: auto;
      margin: 0 auto 48px;
    }

    .about-copy {
      max-width: 820px;
      margin: 0 auto;
      text-align: center;
      font-size: clamp(16px, 1.45vw, 20px);
      font-weight: 400;
      line-height: 1.65;
      color: rgba(255, 255, 255, .82);
    }

    .about-copy + .about-copy { margin-top: 28px; }

    .about-stage {
      position: relative;
      width: min(100%, 900px);
      margin: 40px auto 0;
      aspect-ratio: 1000 / 650;
    }

    .about-stage img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity .5s var(--ease);
    }

    .about-stage img.on { opacity: 1; }

    .about-count {
      margin: 22px 0 8px;
      text-align: center;
      color: rgba(255, 255, 255, .8);
    }

    .about-trust {
      margin-top: 56px;
      overflow: hidden;
    }

    .about-trust h2 {
      margin: 0 0 28px;
      text-align: center;
      font-size: clamp(22px, 3vw, 36px);
    }

    .logo-viewport { overflow: hidden; }

    .logo-row {
      display: flex;
      align-items: center;
      width: max-content;
      animation: logo-scroll 40s linear infinite;
    }

    .logo-row:hover { animation-play-state: paused; }

    .logo-row img {
      height: clamp(64px, 9vw, 120px);
      width: auto;
      max-width: 160px;
      object-fit: contain;
      margin: 0 clamp(16px, 2.4vw, 36px);
      filter: grayscale(1);
      opacity: .6;
      transition: filter .3s var(--ease), opacity .3s var(--ease);
    }

    .logo-row img:hover {
      filter: none;
      opacity: 1;
    }

    @keyframes logo-scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    .about-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      max-width: 900px;
      margin: 72px auto 0;
    }

    .about-cols li {
      margin: 0 0 18px;
      font-size: clamp(16px, 1.6vw, 22px);
    }

    /* Contact : page claire, comme le site d'origine */
    #contact {
      background: #fff;
      color: #000;
    }

    #contact.active { display: block; min-height: 100vh; }

    body:has(#contact.active) { background: #fff; color: #000; }
    body:has(#contact.active) .grain { display: none; }

    body:has(#contact.active) header {
      background: rgba(255, 255, 255, .86);
      border-bottom: 1px solid rgba(0, 0, 0, .1);
      backdrop-filter: blur(8px);
    }

    body:has(#contact.active) .logo img { filter: invert(1); }

    body:has(#contact.active) header a,
    body:has(#contact.active) .menu-btn { color: rgba(0, 0, 0, .55); }

    body:has(#contact.active) header a:hover,
    body:has(#contact.active) header a.active,
    body:has(#contact.active) .menu-btn:hover { color: #000; }

    body:has(#contact.active) :focus-visible { outline-color: #000; }

    .contact-page {
      max-width: 1120px;
      margin: 0 auto;
      padding: clamp(128px, 18vh, 168px) var(--pad) 96px;
    }

    .contact-page h1 {
      margin: 0 0 clamp(56px, 9vh, 104px);
      text-align: center;
      font-size: clamp(40px, 6vw, 76px);
      font-weight: 700;
      letter-spacing: -.03em;
      line-height: .95;
    }

    .contact-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(40px, 6vw, 80px);
      align-items: start;
    }

    .contact-lead {
      margin: 0 0 36px;
      max-width: 34em;
      font-size: clamp(16px, 1.35vw, 18px);
      font-weight: 400;
      font-stretch: 100%;
      letter-spacing: 0;
      text-transform: none;
      line-height: 1.65;
      color: rgba(0, 0, 0, .7);
    }

    .contact-block { margin: 0 0 28px; }

    .contact-kicker {
      display: block;
      margin: 0 0 12px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: rgba(0, 0, 0, .6);
    }

    .contact-link {
      display: block;
      margin: 0 0 12px;
      color: #000;
      text-decoration: none;
      font-size: clamp(16px, 1.5vw, 20px);
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .contact-link:hover { opacity: .7; }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    .contact-form label {
      display: block;
      margin: 0 0 12px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: rgba(0, 0, 0, .6);
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      margin: 0;
      padding: 12px 0;
      border: 0;
      border-bottom: 1px solid rgba(0, 0, 0, .2);
      border-radius: 0;
      background: transparent;
      color: #000;
      font: inherit;
      font-size: clamp(16px, 1.3vw, 18px);
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
    }

    .contact-form textarea {
      min-height: 150px;
      resize: none;
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      outline: none;
      border-bottom-color: #000;
    }

    .contact-form .hp {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .contact-status {
      margin: 0;
      padding: 16px;
      font-size: 14px;
      line-height: 1.45;
    }

    .contact-status.ok {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .contact-status.bad {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .contact-send {
      align-self: flex-start;
      margin-top: 8px;
      padding: 16px 32px;
      border: 0;
      background: #000;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .contact-send:hover { background: rgba(0, 0, 0, .8); }
    .contact-send:disabled { opacity: .5; cursor: not-allowed; }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 28px var(--pad) 32px;
      color: var(--dim);
    }

    :focus-visible { outline: 1px solid var(--white); outline-offset: 3px; }

    @media (max-width: 860px) {
      header { grid-template-columns: 1fr auto; }
      #nav,
      .head-right a { display: none; }
      .menu-btn { display: flex; }
      .names { columns: 2; }

      /* Music Video : une colonne centrée, le titre passe sous l'artiste. */
      #music-video .cat-inner { text-align: center; }
      #music-video .names { columns: 1; }
      #music-video .names a { text-align: center; }
      #music-video .names a + a { margin-top: 16px; }
      #music-video .name-sep { display: none; }
      #music-video .name-artist,
      #music-video .name-title { display: block; }
      .grid { grid-template-columns: 1fr 1fr; }

    /* Nombre pseudo-aléatoire stable, dérivé de l'index du projet. */
    function seeded(index, salt) {
      const x = Math.sin(index * 12.9898 + salt * 78.233) * 43758.5453;
      return x - Math.floor(x);
    }

    function placeholder(index) {
      const el = document.createElement("div");
      el.className = "ph";
      el.setAttribute("aria-hidden", "true");
      for (let n = 0; n < 3; n++) {
        const blob = document.createElement("span");
        blob.style.left = (seeded(index, n * 4 + 1) * 70 - 15) + "%";
        blob.style.top = (seeded(index, n * 4 + 2) * 70 - 15) + "%";
        blob.style.setProperty("--dx", ((seeded(index, n * 4 + 3) - 0.5) * 48) + "px");
        blob.style.setProperty("--dy", ((seeded(index, n * 4 + 4) - 0.5) * 36) + "px");
        blob.style.animationDelay = (-seeded(index, n + 9) * 18) + "s";
        el.appendChild(blob);
      }
      return el;
    }

        video.loop = true;
        video.playsInline = true;
        video.autoplay = true;
        video.preload = "auto";
        if (work.poster) video.poster = work.poster;
        video.src = work.video;
        video.addEventListener("error", () => {
          video.replaceWith(vimeo ? vimeoFrame(parts, "background", index) : placeholder(index));
        });
        return video;
      }
      if (vimeo) return vimeoFrame(parts, "background", index);
      return placeholder(index);
    }

    /* Découpe un texte en mots, puis en lettres. Un mot ne se coupe jamais. */
    function roll(text, className, start) {
      const wrap = document.createElement("span");
      wrap.className = "roll" + (className ? " " + className : "");
      let index = start || 0;
      String(text).split(" ").forEach((word) => {
        if (!word) return;
        const wordEl = document.createElement("span");
        wordEl.className = "word";
        Array.from(word).forEach((char) => {
          const box = document.createElement("span");
          box.className = "ch";
          const glyph = document.createElement("span");
          glyph.dataset.c = char;
          glyph.textContent = char;
          glyph.style.transitionDelay = (index * 0.018) + "s";
          index += 1;
          box.appendChild(glyph);
          wordEl.appendChild(box);
        });
        wrap.appendChild(wordEl);
      });
      wrap.dataset.next = String(index);
      return wrap;
    }

    function appendName(link, work) {
      const artist = roll(work.client, work.title ? "name-artist" : "");

      if (!work.title) return;
      const sep = roll("—", "name-sep", Number(artist.dataset.next));
      const title = roll(work.title, "name-title", Number(sep.dataset.next));
      link.append(sep, title);
    }

    function youtubeId(url) {
      if (!url) return "";
      try {
        const parsed = new URL(url, "https://www.youtube.com");
        if (parsed.hostname.includes("youtu.be")) {
          return (parsed.pathname.split("/").filter(Boolean)[0] || "").split("?")[0];
        }
        if (parsed.searchParams.get("v")) return parsed.searchParams.get("v");
        const parts = parsed.pathname.split("/").filter(Boolean);
        const embed = parts.indexOf("embed");
        if (embed >= 0 && parts[embed + 1]) return parts[embed + 1];
        const shorts = parts.indexOf("shorts");
        if (shorts >= 0 && parts[shorts + 1]) return parts[shorts + 1];
      } catch (error) {
        const match = String(url).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
        return match ? match[1] : "";
      }
      return "";
    }

    function youtubeList(url) {
      if (!url) return "";
      try {
        return new URL(url, "https://www.youtube.com").searchParams.get("list") || "";
      } catch (error) {
        const match = String(url).match(/[?&]list=([A-Za-z0-9_-]+)/);
        return match ? match[1] : "";
      }

    function chosenVimeo(work) {

    function vimeoParts(url) {
      if (!url) return null;
      const match = String(url).match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/([A-Za-z0-9]+))?/);
      if (!match) return null;
      return { id: match[1], hash: match[2] || "" };
    }

    function vimeoId(url) {
      const parts = vimeoParts(url);
      return parts ? parts.id : "";
    }

    function vimeoSrc(parts, mode) {
      const params = mode === "background"
        ? "background=1&autoplay=1&loop=1&muted=1&autopause=0&title=0&byline=0&portrait=0&dnt=1"
        : "autoplay=1&title=0&byline=0&portrait=0&dnt=1";
      const hash = parts.hash ? "&h=" + parts.hash : "";
      return "https://player.vimeo.com/video/" + parts.id + "?" + params + hash;
    }

    function vimeoFrame(parts, mode, index) {
      const iframe = document.createElement("iframe");
      iframe.src = vimeoSrc(parts, mode);
      iframe.allow = "autoplay; fullscreen; picture-in-picture";
      iframe.allowFullscreen = mode !== "background";
      iframe.dataset.vimeo = parts.id;
      iframe.dataset.hash = parts.hash;
      iframe.dataset.mode = mode;
      if (index !== undefined) iframe.dataset.index = String(index);
      iframe.title = "Vimeo";
      return iframe;
    }

    function syncVimeoFrames() {
      document.querySelectorAll("iframe[data-mode='background'][data-index]").forEach((frame) => {
        const work = WORKS[Number(frame.dataset.index)];
        if (!work) return;
        const parts = vimeoParts(chosenVimeo(work));
        if (!parts) return;
        if (frame.dataset.vimeo === parts.id && frame.dataset.hash === parts.hash) return;
        frame.dataset.vimeo = parts.id;
        frame.dataset.hash = parts.hash;
        frame.src = vimeoSrc(parts, "background");
      });
    }

    function vimeoCommand(frame, method, value) {
      if (!frame || !frame.contentWindow) return;
      const message = { method: method };
      if (value !== undefined) message.value = value;
      frame.contentWindow.postMessage(JSON.stringify(message), "https://player.vimeo.com");

        const link = document.createElement("a");
        link.href = href;
        link.textContent = label;
        link.dataset.nav = "";
        if (parent === desktop) link.className = "small";
        parent.appendChild(link);
      }

      Object.keys(TYPES).forEach((type) => {
        if (!worksOfType(type).length) return;
        const info = TYPES[type];
        [desktop, mobile].forEach((parent) => addLink(parent, "#" + info.hash, info.label));
      });

      [desktop, mobile].forEach((parent) => addLink(parent, "#about", "About"));

      const contact = document.createElement("a");
      contact.href = "#contact";
      contact.textContent = "Contact";
      contact.dataset.nav = "";
      mobile.appendChild(contact);
    }

    function openMenu() {
      overlay.hidden = false;
      overlay.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeMenu() {
      overlay.classList.remove("open");
      overlay.hidden = true;
      document.body.style.overflow = "";
    }

    /* ---------- Accueil ---------- */

    function renderHome() {
      const section = document.createElement("section");
      section.id = "home";
      section.className = "view";

      const slides = homeWorks();
      slides.forEach((item) => {
        const slide = document.createElement("div");
        slide.className = "slide";
        slide.appendChild(loopVisual(item.work, item.index));
        slide.addEventListener("click", () => openPlayer(item.work, item.index));
        section.appendChild(slide);
      });

      const caption = document.createElement("p");
      caption.className = "caption";
      caption.id = "caption";
      caption.innerHTML =
        '<span class="line"><span class="wide" id="cap-client"></span></span>' +
        '<span class="line"><span class="wide" id="cap-sub"></span></span>' +
        '<span class="line"><span class="small" id="cap-credit"></span></span>';
      section.appendChild(caption);

      const bar = document.createElement("div");
      bar.className = "progress";
      bar.id = "progress";
      slides.forEach(() => bar.appendChild(document.createElement("span")));
      section.appendChild(bar);

      const counter = document.createElement("div");
      counter.className = "counter";
      counter.id = "counter";
      slides.forEach((item, n) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = String(n + 1).padStart(2, "0") + ".";
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          goSlide(n);
        });
        counter.appendChild(button);
      });
      section.appendChild(counter);

      app.appendChild(section);
      if (slides.length) goSlide(0);
    }

    function applyCaption(work) {
      const caption = document.getElementById("caption");
      document.getElementById("cap-client").textContent = work.client;
      const who = work.role || directorName(work.dir);
      document.getElementById("cap-sub").textContent = who ? work.title + " — " + who : work.title;
      const credit = document.getElementById("cap-credit");
      credit.textContent = work.credit || "";
      credit.parentElement.style.display = work.credit ? "" : "none";
      caption.classList.add("show");
    }

    function setCaption(work, immediate) {
      const caption = document.getElementById("caption");
      if (!caption) return;
      window.clearTimeout(captionTimer);
      if (immediate) {
        applyCaption(work);
        return;
      }
      caption.classList.remove("show");
      captionTimer = window.setTimeout(() => applyCaption(work), 350);
    }

    function pauseInactiveSlide(slide) {
      const timer = window.setTimeout(() => {
        if (slide.classList.contains("on")) return;
        const video = slide.querySelector("video");
        if (video) video.pause();
        const frame = slide.querySelector("iframe[data-vimeo]");
        if (frame) vimeoCommand(frame, "pause");
      }, 1100);
      pauseTimers.push(timer);
    }

    function goSlide(target) {
      const slides = Array.from(document.querySelectorAll("#home .slide"));
      if (!slides.length) return;
      pauseTimers.splice(0).forEach((timer) => window.clearTimeout(timer));
      slideIndex = (target + slides.length) % slides.length;

      slides.forEach((slide, n) => {
        const active = n === slideIndex;
        const video = slide.querySelector("video");
        const frame = slide.querySelector("iframe[data-vimeo]");
        if (active) {
          slide.classList.add("on");
          if (video) {
            try { video.currentTime = 0; } catch (error) { /* pas encore prête */ }
            video.play().catch(() => {});
          }
          if (frame) {
            vimeoCommand(frame, "setCurrentTime", 0);
            vimeoCommand(frame, "play");
          }
        } else if (slide.classList.contains("on")) {
          slide.classList.remove("on");
          pauseInactiveSlide(slide);
        } else {
          slide.classList.remove("on");
          if (video) video.pause();
          if (frame) vimeoCommand(frame, "pause");
        }
      });

      document.querySelectorAll("#counter button").forEach((button, n) => {
        button.classList.toggle("on", n === slideIndex);
      });

      const current = homeWorks()[slideIndex];
      if (current) setCaption(current.work, target === 0 && elapsed === 0);
      startProgress();
    }

    function paintProgress(ratio) {
      const bar = document.getElementById("progress");
      if (!bar) return;
      bar.querySelectorAll("span").forEach((seg, n) => {
        seg.classList.toggle("done", n < slideIndex);
        seg.classList.toggle("on", n === slideIndex);
        if (n === slideIndex) seg.style.setProperty("--p", (ratio * 100) + "%");
      });
    }

    function tick(now) {
      if (showPaused) return;
      elapsed = now - slideStart;
      const ratio = Math.min(1, elapsed / SLIDE_DURATION);
      paintProgress(ratio);
      if (ratio >= 1) {
        goSlide(slideIndex + 1);
        return;
      }
      rafId = requestAnimationFrame(tick);
    }

    function startProgress() {
      cancelAnimationFrame(rafId);
      elapsed = 0;
      slideStart = performance.now();
      paintProgress(0);
      if (!showPaused) rafId = requestAnimationFrame(tick);
    }

    function pauseShow() {
      showPaused = true;
      cancelAnimationFrame(rafId);
      document.querySelectorAll("#home video").forEach((video) => video.pause());
      document.querySelectorAll("#home iframe[data-mode='background']").forEach((frame) => {
        vimeoCommand(frame, "pause");
      });
    }

    function resumeShow() {
      if (playerOpen) return;
      const onHome = document.getElementById("home").classList.contains("active");
      if (!onHome) return;
      showPaused = false;
      cancelAnimationFrame(rafId);
      const video = document.querySelector("#home .slide.on video");
      if (video) video.play().catch(() => {});
      const frame = document.querySelector("#home .slide.on iframe[data-vimeo]");
      if (frame) vimeoCommand(frame, "play");
      slideStart = performance.now() - elapsed;
      rafId = requestAnimationFrame(tick);
    }

    /* ---------- Catégories ---------- */

    function renderCategory(type) {
      const list = worksOfType(type);
      if (!list.length) return;
      const info = TYPES[type];

      const section = document.createElement("section");
      section.id = info.hash;
      section.className = "view cat";

      const backs = document.createElement("div");
      backs.className = "backs";
      list.forEach((item, n) => {
        const bg = document.createElement("div");
        bg.className = "bg" + (n === 0 ? " on" : "");
        bg.dataset.index = String(item.index);
        bg.appendChild(loopVisual(item.work, item.index));
        backs.appendChild(bg);
      });
      section.appendChild(backs);

      const inner = document.createElement("div");
      inner.className = "cat-inner";
      const kicker = document.createElement("p");
      kicker.className = "small";
      kicker.textContent = info.label;
      inner.appendChild(kicker);

      const years = [...new Set(list.map((item) => item.work.year || ""))]
        .sort((a, b) => Number(b) - Number(a));

      years.forEach((year) => {
        const block = document.createElement("div");
        block.className = "year-block";
        if (year) {
          const label = document.createElement("p");
          label.className = "wide year-label";
          label.textContent = year;
          block.appendChild(label);
        }

        const names = document.createElement("div");
        names.className = "names" + (type === "show" ? " split" : "");
        list.filter((item) => (item.work.year || "") === year).forEach((item) => {
          const link = document.createElement("a");
          link.href = "#" + info.hash;
          link.setAttribute("aria-label", labelOf(item.work));
          appendName(link, item.work);
          link.addEventListener("mouseenter", () => showCategoryBg(backs, item.index));
          link.addEventListener("focus", () => showCategoryBg(backs, item.index));
          link.addEventListener("click", (event) => {
            event.preventDefault();
            openPlayer(item.work, item.index);
          });
          names.appendChild(link);
        });
        block.appendChild(names);
        inner.appendChild(block);
      });
      section.appendChild(inner);
      app.appendChild(section);
    }

    function showCategoryBg(backs, index) {
      backs.querySelectorAll(".bg").forEach((bg) => {
        const on = bg.dataset.index === String(index);
        bg.classList.toggle("on", on);
        const video = bg.querySelector("video");
        const frame = bg.querySelector("iframe[data-vimeo]");
        if (video) {
          if (on) video.play().catch(() => {});
          else video.pause();
        }
        if (frame) vimeoCommand(frame, on ? "play" : "pause");
      });
    }

    /* ---------- Réalisateur ---------- */

    function renderDirector(director) {
      const list = WORKS
        .map((work, index) => ({ work, index }))
        .filter((item) => item.work.dir === director.id);

      const section = document.createElement("section");
      section.id = director.id;
      section.className = "view";

      const title = document.createElement("h1");
      title.className = "wide dir-name";
      title.textContent = director.name;
      section.appendChild(title);

      const hero = document.createElement("div");
      hero.className = "hero";
      if (list.length) {
        hero.appendChild(loopVisual(list[0].work, list[0].index));
        hero.addEventListener("click", () => openPlayer(list[0].work, list[0].index));
      } else {
        hero.appendChild(placeholder(0));
      }
      section.appendChild(hero);

      const grid = document.createElement("div");
      grid.className = "grid";
      list.forEach((item, n) => {
        const tile = document.createElement("article");
        tile.className = "tile" + ((n + 1) % 4 === 0 ? " wide-tile" : "");
        tile.appendChild(loopVisual(item.work, item.index));
        const meta = document.createElement("div");
        meta.className = "meta";
        const client = document.createElement("strong");
        client.textContent = item.work.client;
        const name = document.createElement("span");
        name.textContent = item.work.title;
        meta.appendChild(client);
        meta.appendChild(name);
        tile.appendChild(meta);
        tile.addEventListener("click", () => openPlayer(item.work, item.index));
        grid.appendChild(tile);
      });
      section.appendChild(grid);
      app.appendChild(section);
    }

    /* ---------- About ---------- */

    function renderAbout() {
      const section = document.createElement("section");
      section.id = "about";
      section.className = "view";

      const wrap = document.createElement("div");
      wrap.className = "about-wrap";

      const logo = document.createElement("img");
      logo.className = "about-logo";
      logo.src = ABOUT.logo;
      logo.alt = "AMEYA";
      wrap.appendChild(logo);

      const first = document.createElement("p");
      first.className = "about-copy";
      first.textContent = ABOUT.paragraphs[0];
      wrap.appendChild(first);

      const stage = document.createElement("div");
      stage.className = "about-stage";
      ABOUT.gallery.forEach((src, index) => {
        const image = document.createElement("img");
        image.src = src;
        image.alt = "Ameya, photo " + (index + 1);
        if (index === 0) image.className = "on";
        stage.appendChild(image);
      });
      wrap.appendChild(stage);

      const count = document.createElement("p");
      count.className = "small about-count";
      count.textContent = "01 / " + String(ABOUT.gallery.length).padStart(2, "0");
      wrap.appendChild(count);

      const second = document.createElement("p");
      second.className = "about-copy";
      second.textContent = ABOUT.paragraphs[1];
      wrap.appendChild(second);

      const trust = document.createElement("div");
      trust.className = "about-trust";
      const heading = document.createElement("h2");
      heading.className = "wide";
      heading.textContent = "They Trust Us";
      trust.appendChild(heading);

      const viewport = document.createElement("div");
      viewport.className = "logo-viewport";
      const row = document.createElement("div");
      row.className = "logo-row";
      ABOUT.clients.concat(ABOUT.clients).forEach((src) => {
        const image = document.createElement("img");
        image.src = src;
        image.alt = "";
        row.appendChild(image);
      });
      viewport.appendChild(row);
      trust.appendChild(viewport);
      wrap.appendChild(trust);

      const cols = document.createElement("div");
      cols.className = "about-cols";
      [ABOUT.places].forEach((items) => {
        const list = document.createElement("ul");
        list.style.listStyle = "none";
        list.style.margin = "0";
        list.style.padding = "0";
        items.forEach((item) => {
          const li = document.createElement("li");
          li.className = "wide";
          li.textContent = item;
          list.appendChild(li);
        });
        cols.appendChild(list);
      });
      wrap.appendChild(cols);

      section.appendChild(wrap);
      app.appendChild(section);

      let galleryIndex = 0;
      const frames = stage.querySelectorAll("img");
      window.setInterval(() => {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        frames[galleryIndex].classList.remove("on");
        galleryIndex = (galleryIndex + 1) % frames.length;
        frames[galleryIndex].classList.add("on");
        count.textContent =
          String(galleryIndex + 1).padStart(2, "0") + " / " + String(frames.length).padStart(2, "0");
      }, 3000);
    }

    /* ---------- Contact ---------- */

    let contactStatusTimer = 0;

    function renderContact() {
      const section = document.createElement("section");
      section.id = "contact";
      section.className = "view";

      const page = document.createElement("div");
      page.className = "contact-page";

      const title = document.createElement("h1");
      title.className = "wide";
      title.textContent = "Contact";
      page.appendChild(title);

      const split = document.createElement("div");
      split.className = "contact-split";

      const info = document.createElement("div");
      const lead = document.createElement("p");
      lead.className = "contact-lead";
      lead.textContent = CONTACT.intro;
      info.appendChild(lead);

      const mailBlock = document.createElement("div");
      mailBlock.className = "contact-block";
      const mailKicker = document.createElement("span");
      mailKicker.className = "contact-kicker";
      mailKicker.textContent = "Email";
      const mail = document.createElement("a");
      mail.className = "contact-link";
      mail.href = "mailto:" + CONTACT.email;
      mail.textContent = CONTACT.emailLabel;
      mailBlock.appendChild(mailKicker);
      mailBlock.appendChild(mail);
      info.appendChild(mailBlock);

      const socialBlock = document.createElement("div");
      socialBlock.className = "contact-block";
      const socialKicker = document.createElement("span");
      socialKicker.className = "contact-kicker";
      socialKicker.textContent = "Social";
      socialBlock.appendChild(socialKicker);
      CONTACT.socials.forEach(([label, href]) => {
        const link = document.createElement("a");
        link.className = "contact-link";
        link.href = href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = label;
        socialBlock.appendChild(link);
      });
      info.appendChild(socialBlock);
      split.appendChild(info);

      const form = document.createElement("form");
      form.className = "contact-form";
      form.noValidate = false;

      const honeypot = document.createElement("input");
      honeypot.className = "hp";
      honeypot.type = "text";
      honeypot.name = "website";
      honeypot.tabIndex = -1;
      honeypot.autocomplete = "off";
      honeypot.setAttribute("aria-hidden", "true");
      form.appendChild(honeypot);

      const fields = [
        ["name", "Name", "text", true],
        ["email", "Email", "email", true],
        ["message", "Describe your project", "textarea", true]
      ];

      fields.forEach(([id, label, kind, required]) => {
        const field = document.createElement("div");
        const lab = document.createElement("label");
        lab.htmlFor = "contact-" + id;
        lab.textContent = label;
        field.appendChild(lab);
        const input = document.createElement(kind === "textarea" ? "textarea" : "input");
        input.id = "contact-" + id;
        input.name = id;
        if (kind !== "textarea") input.type = kind;
        else input.rows = 6;
        if (required) input.required = true;
        field.appendChild(input);
        form.appendChild(field);
      });

      const status = document.createElement("p");
      status.className = "contact-status";
      status.hidden = true;
      form.appendChild(status);

      const button = document.createElement("button");
      button.className = "contact-send";
      button.type = "submit";
      button.textContent = "Send message";
      form.appendChild(button);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        button.textContent = "Sending...";
        status.hidden = true;
        window.clearTimeout(contactStatusTimer);

        const data = {
          name: form.name.value.trim(),
          email: form.email.value.trim(),
          message: form.message.value.trim(),
          honeypot: honeypot.value
        };

        try {
          const response = await fetch("/api/contact", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
          });
          const payload = await response.json().catch(() => ({}));
          if (response.ok) {
            status.className = "contact-status ok";
            status.textContent = "Message sent successfully! I'll get back to you soon.";
            form.reset();
          } else {
            status.className = "contact-status bad";
            status.textContent = payload.error || "Failed to send message. Please try again.";
          }
        } catch (error) {
          status.className = "contact-status bad";
          status.textContent = "An error occurred. Please try again later.";
        }

        status.hidden = false;
        button.disabled = false;
        button.textContent = "Send message";
        contactStatusTimer = window.setTimeout(() => {
          status.hidden = true;
        }, 5000);
      });

      split.appendChild(form);
      page.appendChild(split);
      section.appendChild(page);
      app.appendChild(section);
    }

    /* ---------- Lecteur ---------- */

    function openPlayer(work, index) {
      const screen = document.getElementById("player-screen");
      screen.innerHTML = "";
      const id = youtubeId(work.youtube);
      const list = id ? "" : youtubeList(work.youtube);
      const portrait = phoneQuery.matches && Boolean(work.vimeoMobile);
      const parts = vimeoParts(chosenVimeo(work));
      const vimeo = parts ? parts.id : "";
      screen.classList.toggle("is-portrait", portrait && Boolean(vimeo));

      if (id || list) {
        const iframe = document.createElement("iframe");
        iframe.referrerPolicy = "strict-origin-when-cross-origin";
        iframe.src = id
          ? "https://www.youtube-nocookie.com/embed/" + id + "?autoplay=1&rel=0&modestbranding=1&playsinline=1"
          : "https://www.youtube-nocookie.com/embed/videoseries?list=" + encodeURIComponent(list) + "&autoplay=1&rel=0&modestbranding=1&playsinline=1";
        iframe.allow = "autoplay; fullscreen; picture-in-picture";
        iframe.allowFullscreen = true;
        iframe.title = labelOf(work);
        screen.appendChild(iframe);
      } else if (vimeo) {
        const iframe = vimeoFrame(parts, "player");
        iframe.title = labelOf(work);
        screen.appendChild(iframe);
      } else if (work.full || work.video) {
        const video = document.createElement("video");
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        if (work.poster) video.poster = work.poster;
        video.src = work.full || work.video;
        screen.appendChild(video);
        video.play().catch(() => {});
      } else {
        screen.appendChild(placeholder(index));
      }

      document.getElementById("player-title").textContent = labelOf(work);
      const who = work.creditName || work.role || directorName(work.dir);
      const stamp = work.madeFor || work.year;
      const note = work.line || work.credit;
      const bits = [who, stamp, note].filter(Boolean);
      const sub = document.getElementById("player-sub");
      sub.innerHTML = "";
      if (!work.creditName && !work.role && work.dir && DIRECTORS.some((d) => d.id === work.dir)) {
        const link = document.createElement("a");
        link.href = "#" + work.dir;
        link.textContent = directorName(work.dir);
        link.addEventListener("click", () => closePlayer());
        sub.appendChild(link);
        const rest = [work.madeFor || work.year, work.credit].filter(Boolean);
        if (rest.length) sub.appendChild(document.createTextNode(" · " + rest.join(" · ")));
      } else {
        sub.textContent = bits.join(" · ");
      }

      player.inert = false;
      player.classList.add("open");
      playerOpen = true;
      pauseShow();
      document.getElementById("player-close").focus();
    }

    function closePlayer() {
      if (!playerOpen) return;
      player.classList.remove("open");
      player.inert = true;
      playerOpen = false;
      const screen = document.getElementById("player-screen");
      screen.classList.remove("is-portrait");
      screen.querySelectorAll("video").forEach((video) => {
        video.pause();
        video.removeAttribute("src");
        video.load();
      });
      screen.innerHTML = "";
      resumeShow();
    }

    /* ---------- Routeur ---------- */

    function hashIsKnown(hash) {
      if (!hash || hash === "home" || hash === "contact" || hash === "about") return true;
      if (DIRECTORS.some((d) => d.id === hash)) return true;
      return Object.keys(TYPES).some((type) => TYPES[type].hash === hash && worksOfType(type).length);
    }

    function playPageMedia(section) {
      if (!section) return;
      section.querySelectorAll("video").forEach((video) => {
        const bg = video.closest(".bg");
        const slide = video.closest(".slide");
        const visible = (!bg || bg.classList.contains("on")) && (!slide || slide.classList.contains("on"));
        if (visible) video.play().catch(() => {});
        else video.pause();
      });
      section.querySelectorAll("iframe[data-mode='background']").forEach((frame) => {
        const bg = frame.closest(".bg");
        const slide = frame.closest(".slide");
        const visible = (!bg || bg.classList.contains("on")) && (!slide || slide.classList.contains("on"));
        vimeoCommand(frame, visible ? "play" : "pause");
      });
    }

    function route() {
      const raw = location.hash.replace("#", "");
      if (!hashIsKnown(raw)) {
        location.hash = "home";
        return;
      }
      const hash = raw || "home";
      closeMenu();
      document.querySelectorAll(".view").forEach((view) => {
        const on = view.id === hash;
        view.classList.toggle("active", on);
        view.hidden = !on;
        view.inert = !on;
      });
      document.querySelectorAll("[data-nav]").forEach((link) => {
        link.classList.toggle("active", link.getAttribute("href") === "#" + hash);
      });
      window.scrollTo(0, 0);
      document.querySelectorAll("video").forEach((video) => video.pause());

      if (hash === "home") resumeShow();
      else {
        pauseShow();
        playPageMedia(document.getElementById(hash));
      }
    }

    function init() {
      renderNav();
      renderHome();
      renderCategory("pub");
      renderCategory("clip");
      renderCategory("show");
      renderCategory("contenu");
      DIRECTORS.forEach(renderDirector);
      renderAbout();
      renderContact();

      document.getElementById("open-menu").addEventListener("click", openMenu);
      document.getElementById("close-menu").addEventListener("click", closeMenu);
      document.getElementById("player-close").addEventListener("click", closePlayer);
      overlay.addEventListener("click", (event) => {
        if (event.target.closest("a")) closeMenu();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        if (overlay.classList.contains("open")) closeMenu();
        else closePlayer();
      });
      window.addEventListener("hashchange", route);
      phoneQuery.addEventListener("change", syncVimeoFrames);
      route();
    }

    init();
  </script>
