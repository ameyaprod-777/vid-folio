      try {
        if (location.pathname !== "/" && location.pathname !== "/index.html") return;
        if (localStorage.getItem("ameya-lang")) return;
        var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
        if (/^fr\b/i.test(String(langs[0]))) location.replace("/fr/" + location.hash);
      } catch (error) {}
    })();

  <style>
    :root {
      --black: #000;
      --white: #FFF;
      --light: #E6E6E6;
      --dim: #A0A0A0;
      --pad: clamp(18px, 2.6vw, 32px);
      --ease: cubic-bezier(.65, 0, .15, 1);
    }

    * { box-sizing: border-box; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    html, body { margin: 0; padding: 0; }

    body {
      background: var(--black);
      color: var(--light);
      font-family: "Archivo", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    ::selection { background: var(--white); color: var(--black); }

    button { font-family: inherit; }

    a { color: inherit; }

    img { display: block; }

    /* Titres étirés et labels de menu */
    .wide {
      font-stretch: 125%;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .01em;
    }

    .small {
      font-size: 11px;
      font-stretch: 115%;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    /* Grain de pellicule qui vibre */
    .grain {
      position: fixed;
      inset: -50%;
      pointer-events: none;
      z-index: 90;
      opacity: .09;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      animation: grain .8s steps(3) infinite;
    }

    @keyframes grain {
      0% { transform: translate(0, 0); }
      33% { transform: translate(-2%, 1.5%); }
      66% { transform: translate(1.5%, -2%); }
      100% { transform: translate(-1%, 2%); }
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 60;
      padding: 22px var(--pad);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      pointer-events: none;
    }

    header a,
    header button { pointer-events: auto; }

    .logo img { height: 48px; width: auto; }

    #nav {
      display: flex;
      gap: 28px;
      align-items: center;
    }

    .head-right {
      justify-self: end;
      display: flex;
      align-items: center;
    }

    .lang-switch { margin-right: 24px; }

    header a,
    .menu-btn {
      color: var(--dim);
      text-decoration: none;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      transition: color .3s var(--ease);
    }

    header a:hover,
    header a.active,
    .menu-btn:hover { color: var(--white); }

    .menu-btn {
      display: none;
      width: 26px;
      height: 16px;
      flex-direction: column;
      justify-content: space-between;
      color: var(--white);
    }

    .menu-btn span {
      display: block;
      width: 100%;
      height: 1.5px;
      background: currentColor;
    }

    /* Menu mobile */
    #overlay {
      position: fixed;
      inset: 0;
      background: var(--black);
      z-index: 70;
      display: none;
      flex-direction: column;
      justify-content: center;
      padding: 22px var(--pad);
      gap: 6px;
    }

    #overlay.open { display: flex; }

    #overlay .close {
      position: absolute;
      top: 22px;
      right: var(--pad);
      background: none;
      border: 0;
      color: var(--white);
      cursor: pointer;
    }

    #overlay-nav {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #overlay a {
      display: block;
      color: var(--white);
      text-decoration: none;
      font-stretch: 125%;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .01em;
      font-size: clamp(34px, 10vw, 60px);
      line-height: 1.05;
    }

    /* Pages : une seule visible */
    .view { display: none; }

    .view.active {
      display: block;
      animation: view-in .7s var(--ease);
    }

    @keyframes view-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Visuel provisoire : trois halos gris */
    .ph {
      position: absolute;
      inset: 0;
      background: #000;
      overflow: hidden;
    }

    .ph span { display: none; }

    /* Accueil : diaporama plein écran */
    #home {
      position: fixed;
      inset: 0;
      background: var(--black);
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      z-index: 0;
      pointer-events: none;
      transition: opacity 1.1s var(--ease);
    }

    .slide.on {
      opacity: 1;
      z-index: 1;
    }

    /* Préchargement : même écran que l'ancienne version */
    #boot {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      transition: opacity .5s ease;
    }

    #boot.done { opacity: 0; pointer-events: none; }
    #boot[hidden] { display: none; }

    .boot-grid { display: none; }

    .boot-panel {
      position: relative;
      width: min(672px, calc(100% - 64px));
      text-align: center;
    }

    .boot-brand {
      margin-bottom: 48px;
      animation: boot-in .6s ease both;
    }

    .boot-brand img {
      width: 168px;
      height: 168px;
      margin: 0 auto;
      object-fit: contain;
    }

    .boot-brand p {
      margin: 24px 0 0;
      color: rgba(255, 255, 255, .6);
      font-size: 14px;
      font-weight: 300;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .boot-track {
      position: relative;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .1);
    }

    .boot-track span {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(255,255,255,.2), #fff, rgba(255,255,255,.2));
      box-shadow: 0 0 20px rgba(255, 255, 255, .5);
    }

    .boot-track i {
      position: absolute;
      top: 50%;
      left: 0;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 15px rgba(255, 255, 255, .8);
      transform: translate(-50%, -50%);
      animation: boot-glow 1s ease-in-out infinite;
    }

    .boot-pct {
      margin: 24px 0 0;
      color: rgba(255, 255, 255, .9);
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 24px;
      font-weight: 300;
    }

    .boot-msg {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 48px 0 0;
      color: rgba(255, 255, 255, .4);
      font-size: 12px;
      font-weight: 300;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .boot-msg::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .4);
      animation: boot-glow 1s ease-in-out infinite;
    }

    @keyframes boot-in {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes boot-glow {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.2); }
    }

    .boot-msg::before { animation-name: boot-dot; }

    @keyframes boot-dot {
      0%, 100% { opacity: .4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    @media (min-width: 640px) {
      .boot-brand img { width: 200px; height: 200px; }
      .boot-brand p { font-size: 16px; }
      .boot-pct { font-size: 30px; }
      .boot-msg { font-size: 14px; }
    }

    @media (min-width: 768px) {
      .boot-brand img { width: 240px; height: 240px; }
    }

    .media {
      position: absolute;
      inset: 0;
    }

    .slide video,
    .slide iframe,
    .bg iframe,
    .hero iframe,
    .tile iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      object-fit: cover;
    }

    .slide iframe,
    .bg iframe,
    .hero iframe,
    .tile iframe { pointer-events: none; }

    /* La vidéo n'apparaît qu'une fois réellement en lecture : jamais d'image figée. */
    #home .media iframe {
      opacity: 0;
      transition: opacity .6s var(--ease);
    }

    #home .media.is-live iframe { opacity: 1; }

    .slide::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, .35), transparent 22%, transparent 60%, rgba(0, 0, 0, .55));
      pointer-events: none;
    }

    .caption {
      position: absolute;
      left: var(--pad);
      bottom: 40px;
      z-index: 5;
      text-align: left;
      pointer-events: none;
      margin: 0;
    }

    .caption .line {
      display: block;
      overflow: hidden;
    }

    .caption .line > span {
      display: inline-block;
      transform: translateY(110%);
      transition: transform .9s var(--ease);
    }

    .caption.show .line:nth-child(1) > span { transform: translateY(0); transition-delay: 0s; }
    .caption.show .line:nth-child(2) > span { transform: translateY(0); transition-delay: .08s; }
    .caption.show .line:nth-child(3) > span { transform: translateY(0); transition-delay: .16s; }

    #cap-client,
    #cap-sub { font-size: clamp(20px, 2.3vw, 30px); }

    #cap-sub { font-weight: 500; }

    #cap-credit { opacity: .75; }

    .progress {
      position: absolute;
      left: var(--pad);
      right: var(--pad);
      bottom: 22px;
      z-index: 6;
      display: flex;
      gap: 7px;
      height: 2px;
      pointer-events: none;
    }

    .progress span {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: rgba(255, 255, 255, .22);
    }

    .progress span::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0;
      background: var(--white);
    }

    .progress span.done::after { width: 100%; }
    .progress span.on::after { width: var(--p, 0%); }

    /* Zone invisible : la moitié droite de l'accueil passe à l'extrait suivant. */
    .skip-next {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 50%;
      z-index: 4;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: e-resize;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .skip-next:focus { outline: none; }

    /* Compteur : codé, masqué. Passer en display:flex pour l'afficher. */
    .counter {
      display: none;
      position: absolute;
      left: var(--pad);
      bottom: 28px;
      z-index: 6;
      gap: 16px;
    }

    .counter button {
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      font-stretch: 125%;
      font-weight: 700;
      letter-spacing: .01em;
      color: rgba(244, 244, 242, .32);
      transition: color .3s var(--ease);
    }

    .counter button.on,
    .counter button:hover { color: var(--white); }

    /* Lecteur */
    #player {
      position: fixed;
      inset: 0;
      background: var(--black);
      z-index: 80;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .5s var(--ease), visibility .5s var(--ease);
    }

    #player.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #player .close {
      position: absolute;
      top: 22px;
      right: var(--pad);
      z-index: 2;
      background: none;
      border: 0;
      color: var(--white);
      cursor: pointer;
    }

    .screen {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(92vw, 160vh);
      aspect-ratio: 16 / 9;
      background: var(--black);
      overflow: hidden;
    }

    .screen video,
    .screen iframe {
      width: 100%;
      height: 100%;
      border: 0;
      object-fit: contain;
    }

    /* Téléphone : la version 9:16 occupe tout l'écran, sans bande 16:9. */
    @media (max-width: 860px) {
      .screen.is-portrait {
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        aspect-ratio: auto;
        transform: none;
      }

      .screen.is-portrait iframe { object-fit: cover; }
    }

    .player-meta {
      position: absolute;
      left: var(--pad);
      bottom: 28px;
      margin: 0;
    }

    .player-title {
      margin: 0 0 8px;
      font-weight: 700;
      font-size: 22px;
    }

    .player-sub { margin: 0; color: var(--dim); }

    .player-sub a { color: var(--light); text-decoration: none; }
    .player-sub a:hover { color: var(--white); }

    /* Catégories */
    .cat { min-height: 100vh; background: var(--black); }

    .backs { position: fixed; inset: 0; z-index: 0; }

    .bg {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity .8s var(--ease);
      filter: blur(18px) brightness(.55);
      transform: scale(1.1);
    }

    .bg.on { opacity: 1; }

    .bg video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cat-inner {
      position: relative;
      z-index: 2;
      max-width: 1000px;
      margin: 0 auto;
      padding: clamp(140px, 28vh, 290px) var(--pad) 80px;
    }

    .cat-inner > .small { color: var(--dim); margin: 0 0 22px; }

    .year-block + .year-block { margin-top: 42px; }

    .year-label {
      margin: 0 0 16px;
      color: var(--white);
      font-size: clamp(28px, 4vw, 52px);
      line-height: .9;
    }

    .names {
      columns: 3;
      column-gap: 32px;
    }

    .names a {
      display: block;
      break-inside: avoid;
      color: var(--white);
      text-decoration: none;
      text-transform: uppercase;
      font-stretch: 125%;
      font-weight: 700;
      font-size: clamp(12px, 1.1vw, 14px);
      line-height: 1.6;
      letter-spacing: .01em;
      transition: opacity .3s var(--ease);
    }

    .names:hover a { opacity: .4; }
    .names a:hover { opacity: 1; }

    .names.split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 32px;
      align-items: start;
    }

    .names.split a:first-child { grid-column: 1; grid-row: 1; }
    .names.split a:nth-child(2) { grid-column: 2; grid-row: 1; }
    .names.split a:nth-child(3) { grid-column: 2; grid-row: 2; }

    /* Lettres qui roulent */
    .roll { display: inline; }
    .word { display: inline-block; white-space: nowrap; }
    .word + .word { margin-left: .3em; }
    .name-sep { margin-inline: .35em; }

    .ch {
      display: inline-block;
      overflow: hidden;
      height: 1.15em;
      line-height: 1.15em;
      vertical-align: bottom;
    }

    .ch > span {
      display: block;
      position: relative;
      transition: transform .45s var(--ease);
    }

    .ch > span::after {
      content: attr(data-c);
      position: absolute;
      left: 0;
      top: 100%;
    }

    a:hover .ch > span { transform: translateY(-100%); }

    /* Page réalisateur */
    .dir-name {
      position: fixed;
      top: 66px;
      left: var(--pad);
      z-index: 5;
      margin: 0;
      font-size: clamp(28px, 4vw, 64px);
      pointer-events: none;
    }

    .hero {
      position: relative;
      height: 100vh;
      cursor: pointer;
      overflow: hidden;
    }

    .hero video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 8px;
      background: var(--black);
    }

    .tile {
      position: relative;
      aspect-ratio: 16 / 11;
      overflow: hidden;
      cursor: pointer;
      background: #111;
    }

    .tile.wide-tile {
      grid-column: 1 / -1;
      aspect-ratio: 21 / 9;
    }

    .tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 1.2s var(--ease);
    }

    .tile::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, .35);
      opacity: 0;
      transition: opacity .5s var(--ease);
    }

    .tile .meta {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 2;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .6s var(--ease), transform .6s var(--ease);
    }

    .tile .meta strong,
    .tile .meta span {
      display: block;
      text-transform: uppercase;
      font-stretch: 125%;
      letter-spacing: .01em;
    }

    .tile .meta strong { font-weight: 800; font-size: 14px; }
    .tile .meta span { font-weight: 500; font-size: 13px; margin-top: 4px; }

    .tile:hover video,
    .tile:hover .ph { transform: scale(1.05); }
    .tile:hover::after { opacity: 1; }
    .tile:hover .meta { opacity: 1; transform: translateY(0); }

    .ph { transition: transform 1.2s var(--ease); }

    /* About */
    .about-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: clamp(110px, 16vh, 160px) var(--pad) 80px;
    }

    .about-logo {
      width: clamp(128px, 16vw, 220px);
      height: auto;
      margin: 0 auto 48px;
    }

    .about-copy {
      max-width: 820px;
      margin: 0 auto;
      text-align: center;
      font-size: clamp(16px, 1.45vw, 20px);
      font-weight: 400;
      line-height: 1.65;
      color: rgba(255, 255, 255, .82);
    }

    .about-copy + .about-copy { margin-top: 28px; }

    .about-stage {
      position: relative;

    /* Nombre pseudo-aléatoire stable, dérivé de l'index du projet. */
    function seeded(index, salt) {
      const x = Math.sin(index * 12.9898 + salt * 78.233) * 43758.5453;
      return x - Math.floor(x);
    }

    function placeholder(index) {
      const el = document.createElement("div");
      el.className = "ph";
      el.setAttribute("aria-hidden", "true");
      for (let n = 0; n < 3; n++) {
        const blob = document.createElement("span");
        blob.style.left = (seeded(index, n * 4 + 1) * 70 - 15) + "%";
        blob.style.top = (seeded(index, n * 4 + 2) * 70 - 15) + "%";
        blob.style.setProperty("--dx", ((seeded(index, n * 4 + 3) - 0.5) * 48) + "px");
        blob.style.setProperty("--dy", ((seeded(index, n * 4 + 4) - 0.5) * 36) + "px");
        blob.style.animationDelay = (-seeded(index, n + 9) * 18) + "s";
        el.appendChild(blob);
      }
      return el;
    }

    /* Réserve le cadre. Le lecteur n'est branché que quand ce cadre est visible. */
    function loopVisual(work, index) {
      const host = document.createElement("div");
      host.className = "media";
      host.dataset.index = String(index);
      host.appendChild(placeholder(index));
      return host;

    function releaseMedia(host) {
      if (!host) return;
      host.querySelectorAll("iframe, video").forEach((el) => {
        if (el.tagName === "IFRAME") el.src = "about:blank";
        else {
          el.pause();
          el.removeAttribute("src");
          el.load();
        }
        el.remove();
      });
    }

    function activateMedia(host, mode) {
      if (!host) return null;
      const work = WORKS[Number(host.dataset.index)];
      if (!work) return null;
      const playMode = mode || "background";
      const parts = vimeoParts(chosenVimeo(work));

      if (work.video && !parts) {
        let video = host.querySelector("video");
        if (!video) {
          video = document.createElement("video");
          video.muted = true;
          video.loop = true;
          video.playsInline = true;
          video.preload = "metadata";
          if (work.poster) video.poster = work.poster;
          video.src = work.video;
          video.addEventListener("error", () => releaseMedia(host));
          host.appendChild(video);
        }
        video.play().catch(() => {});
        return video;
      }

      if (!parts) return null;
      const hash = parts.hash || "";
      const current = host.querySelector("iframe");
      if (current && current.dataset.vimeo === parts.id && current.dataset.hash === hash && current.dataset.mode === playMode) {
        return current;
      }
      releaseMedia(host);
      const frame = vimeoFrame(parts, playMode, Number(host.dataset.index));
      frame.dataset.want = "play";
      host.appendChild(frame);
      return frame;
    }

    /* Découpe un texte en mots, puis en lettres. Un mot ne se coupe jamais. */
    function roll(text, className, start) {
      const wrap = document.createElement("span");
      wrap.className = "roll" + (className ? " " + className : "");
      let index = start || 0;
      String(text).split(" ").forEach((word) => {
        if (!word) return;
        const wordEl = document.createElement("span");
        wordEl.className = "word";
        Array.from(word).forEach((char) => {
          const box = document.createElement("span");
          box.className = "ch";
          const glyph = document.createElement("span");
          glyph.dataset.c = char;
          glyph.textContent = char;
          glyph.style.transitionDelay = (index * 0.018) + "s";
          index += 1;
          box.appendChild(glyph);
          wordEl.appendChild(box);
        });
        wrap.appendChild(wordEl);
      });
      wrap.dataset.next = String(index);
      return wrap;
    }

    function appendName(link, work) {
      const artist = roll(work.client, work.title ? "name-artist" : "");
      link.appendChild(artist);
      if (!work.title) return;
      const sep = roll("—", "name-sep", Number(artist.dataset.next));
      const title = roll(work.title, "name-title", Number(sep.dataset.next));
      link.append(sep, title);
    }

    function youtubeId(url) {
      if (!url) return "";
      try {
        const parsed = new URL(url, "https://www.youtube.com");
        if (parsed.hostname.includes("youtu.be")) {
          return (parsed.pathname.split("/").filter(Boolean)[0] || "").split("?")[0];
        }
        if (parsed.searchParams.get("v")) return parsed.searchParams.get("v");
        const parts = parsed.pathname.split("/").filter(Boolean);
        const embed = parts.indexOf("embed");
        if (embed >= 0 && parts[embed + 1]) return parts[embed + 1];
        const shorts = parts.indexOf("shorts");
        if (shorts >= 0 && parts[shorts + 1]) return parts[shorts + 1];
      } catch (error) {
        const match = String(url).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
        return match ? match[1] : "";
      }
      return "";
    }

    function youtubeList(url) {
      if (!url) return "";
      try {
        return new URL(url, "https://www.youtube.com").searchParams.get("list") || "";
      } catch (error) {
        const match = String(url).match(/[?&]list=([A-Za-z0-9_-]+)/);
        return match ? match[1] : "";
      }
    }

    const phoneQuery = window.matchMedia("(max-width: 860px)");

    /* Sur téléphone, le lien 9:16 prend le relais dès qu'il est renseigné. */
    function chosenVimeo(work) {
      if (phoneQuery.matches && work.vimeoMobile) return work.vimeoMobile;
      return work.vimeo || "";
    }

    function vimeoParts(url) {
      if (!url) return null;
      const match = String(url).match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/([A-Za-z0-9]+))?/);
      if (!match) return null;
      return { id: match[1], hash: match[2] || "" };
    }

    function vimeoId(url) {
      const parts = vimeoParts(url);
      return parts ? parts.id : "";
    }

    function vimeoSrc(parts, mode) {
      const params = mode === "background"
        ? "background=1&autoplay=1&loop=1&muted=1&autopause=0&title=0&byline=0&portrait=0&dnt=1"
        : "autoplay=1&playsinline=1&autopause=0&title=0&byline=0&portrait=0&dnt=1";
      const hash = parts.hash ? "&h=" + parts.hash : "";
      return "https://player.vimeo.com/video/" + parts.id + "?" + params + hash;
    }

    function vimeoFrame(parts, mode, index) {
      const iframe = document.createElement("iframe");
      iframe.src = vimeoSrc(parts, mode);
      iframe.referrerPolicy = "strict-origin-when-cross-origin";
      iframe.allow = "autoplay; fullscreen; picture-in-picture";
      iframe.allowFullscreen = mode !== "background";
      iframe.dataset.vimeo = parts.id;
      iframe.dataset.hash = parts.hash;
      iframe.dataset.mode = mode;
      if (index !== undefined) iframe.dataset.index = String(index);
      iframe.title = "Vimeo";
      return iframe;
    }

    function syncVimeoFrames() {
      refreshHome();
      document.querySelectorAll(".view.active:not(#home) .media").forEach((host) => {
        const frame = host.querySelector("iframe");
        if (!frame) return;
        const mode = frame.dataset.mode || "background";
        releaseMedia(host);
        const next = activateMedia(host, mode);
        if (next) next.dataset.want = frame.dataset.want || "play";
      });
    }

    function attachVimeoBridge() {
      window.addEventListener("message", (event) => {
        if (event.origin !== "https://player.vimeo.com") return;
        let data;
        try {
          data = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
        } catch (error) {
          return;
        }
        if (!data || !data.event) return;
        const frame = Array.from(document.querySelectorAll("iframe[data-vimeo]")).find((item) => item.contentWindow === event.source);
        if (!frame) return;
        if (frame.dataset.home === "1") {
          homeEvent(frame, data);
          return;
        }
        if (data.event === "ready") {
          frame.dataset.ready = "1";
          vimeoCommand(frame, frame.dataset.want === "pause" ? "pause" : "play");
        }
        if (data.event === "error" && frame.dataset.mode === "background" && frame.dataset.retried !== "1") {
          frame.dataset.retried = "1";
          frame.dataset.ready = "";
          frame.src = vimeoSrc({ id: frame.dataset.vimeo, hash: frame.dataset.hash || "" }, "background");
        }
      });
    }

    function vimeoCommand(frame, method, value) {
      if (!frame || !frame.contentWindow) return;
      const message = { method: method };
      if (value !== undefined) message.value = value;
      frame.contentWindow.postMessage(JSON.stringify(message), "https://player.vimeo.com");
    }

    function applyCaption(work) {

    /* ---------- Accueil : moteur vidéo ----------
       Deux lecteurs Vimeo au plus : la slide affichée, et la suivante,
       préparée en pause sur sa première image. Chaque iframe est créée
       directement dans sa slide et n'est jamais déplacée (déplacer une
       iframe la recharge). Une slide n'apparaît qu'une fois sa vidéo en
       lecture, et la barre de progression n'avance que pendant la lecture. */

    const HOME_EVENTS = ["play", "pause", "playProgress", "timeupdate", "bufferstart", "bufferend", "error"];
    const START_TIMEOUT = 7000;  // lecture non démarrée : on recharge une fois, puis on passe
    const STALL_TIMEOUT = 4000;  // vidéo bloquée en chargement : slide suivante
    const SWITCH_WAIT = 2500;    // attente max de la slide suivante avant le fondu
    const PRIME_DELAY = 1500;    // la suivante se prépare quand l'actuelle tourne déjà

    let homeStarted = false;
    let homeShown = false;
    let homePending = -1;
    let homeFailures = 0;
    let homeSwitchTimer = 0;
    let homePrimeTimer = 0;
    let homeTrimTimer = 0;
    let lastTick = 0;
    let resolveFirstLive = () => {};
    const firstLive = new Promise((resolve) => {
      resolveFirstLive = resolve;
    });

    function homeHosts() {
      return Array.from(document.querySelectorAll("#home .slide .media"));
    }

    function homeFrameAt(n) {
      const host = homeHosts()[n];
      return host ? host.querySelector("iframe") : null;
    }

    function unmountHome(host) {
      if (!host) return;
      const frame = host.querySelector("iframe");
      host.classList.remove("is-live");
      if (!frame) return;
      window.clearTimeout(frame._startTimer);
      window.clearTimeout(frame._stallTimer);
      frame.src = "about:blank";
      frame.remove();
    }

    function armStartWatch(frame) {
      window.clearTimeout(frame._startTimer);
      frame._startTimer = window.setTimeout(() => {
        if (!frame.isConnected || frame.dataset.want !== "play" || frame.dataset.playing === "1") return;
        if (frame.dataset.retried !== "1") {
          frame.dataset.retried = "1";
          frame.dataset.ready = "";
          frame.dataset.started = "";
          frame.parentElement.classList.remove("is-live");
          frame.src = vimeoSrc({ id: frame.dataset.vimeo, hash: frame.dataset.hash || "" }, "background");
          armStartWatch(frame);
          return;
        }
        skipFailedSlide(frame);
      }, START_TIMEOUT);
    }

    function skipFailedSlide(frame) {
      frame.dataset.failed = "1";
      const hosts = homeHosts();
      const index = hosts.indexOf(frame.parentElement);
      homeFailures += 1;
      if (index === slideIndex && !homeStarted) resolveFirstLive();
      if (homeFailures >= hosts.length) return;
      if (index === homePending || (index === slideIndex && homePending < 0)) goSlide(index + 1);
    }

    function setHomeWant(frame, want) {
      frame.dataset.want = want;
      if (frame.dataset.ready !== "1") return;
      if (want === "play") {
        vimeoCommand(frame, "play");
        if (frame.dataset.playing !== "1") armStartWatch(frame);
      } else if (frame.dataset.started === "1") {
        frame.dataset.playing = "0";
        vimeoCommand(frame, "pause");
      }
    }

    function mountHome(host, want) {
      if (!host) return null;
      const work = WORKS[Number(host.dataset.index)];
      const parts = work ? vimeoParts(chosenVimeo(work)) : null;
      if (!parts) return null;
      let frame = host.querySelector("iframe");
      if (frame && (frame.dataset.vimeo !== parts.id || frame.dataset.hash !== parts.hash)) {
        unmountHome(host);
        frame = null;
      }
      if (!frame) {
        frame = vimeoFrame(parts, "background", Number(host.dataset.index));
        frame.dataset.home = "1";
        frame.dataset.want = want;
        host.classList.remove("is-live");
        host.appendChild(frame);
        armStartWatch(frame);
        return frame;
      }
      setHomeWant(frame, want);
      return frame;
    }

    function homeEvent(frame, data) {
      const host = frame.parentElement;
      if (!host) return;
      const index = homeHosts().indexOf(host);

      if (data.event === "ready") {
        frame.dataset.ready = "1";
        HOME_EVENTS.forEach((name) => vimeoCommand(frame, "addEventListener", name));
        vimeoCommand(frame, "play");
        return;
      }

      if (data.event === "playProgress" || data.event === "timeupdate") {
        const seconds = data.data ? Number(data.data.seconds) : 0;
        if (!(seconds > 0)) return;
        onHomeProgress(frame, host, index);
        return;
      }

      if (data.event === "bufferstart") {
        frame.dataset.buffering = "1";
        if (frame.dataset.started !== "1" || frame.dataset.want !== "play") return;
        window.clearTimeout(frame._stallTimer);
        frame._stallTimer = window.setTimeout(() => {
          if (!frame.isConnected || frame.dataset.buffering !== "1") return;
          if (homeShown && index === slideIndex && homePending < 0) goSlide(slideIndex + 1);
        }, STALL_TIMEOUT);
        return;
      }

      if (data.event === "bufferend") {
        frame.dataset.buffering = "";
        window.clearTimeout(frame._stallTimer);
        return;
      }

      if (data.event === "pause") {
        frame.dataset.playing = "0";
        // Vimeo peut suspendre de lui-même une vidéo de fond : on relance.
        if (frame.dataset.want === "play" && homeShown) vimeoCommand(frame, "play");
        return;
      }

      if (data.event === "error" && frame.dataset.want === "play") {
        window.clearTimeout(frame._startTimer);
        frame._startTimer = window.setTimeout(() => armStartWatch(frame), 0);
      }
    }

    function onHomeProgress(frame, host, index) {
      frame.dataset.buffering = "";
      frame.dataset.failed = "";
      window.clearTimeout(frame._startTimer);
      window.clearTimeout(frame._stallTimer);
      homeFailures = 0;
      if (frame.dataset.started !== "1") {
        frame.dataset.started = "1";
        host.classList.add("is-live");
      }
      if (frame.dataset.want !== "play") {
        // Slide préparée : première image décodée, on attend son tour.
        frame.dataset.playing = "0";
        vimeoCommand(frame, "pause");
        return;
      }
      frame.dataset.playing = "1";
      if (index === slideIndex) resolveFirstLive();
      if (index === homePending && index !== slideIndex) commitSlide(index);
    }

    function currentPlaying() {
      const frame = homeFrameAt(slideIndex);
      if (!frame || frame.dataset.failed === "1") return true;
      return frame.dataset.playing === "1" && frame.dataset.buffering !== "1";
    }

    function trimHome() {
      const hosts = homeHosts();
      if (!hosts.length) return;
      const keep = new Set([slideIndex, (slideIndex + 1) % hosts.length]);
      if (homePending >= 0) keep.add(homePending);
      hosts.forEach((host, n) => {
        if (!keep.has(n)) unmountHome(host);
      });
    }

    function scheduleHomePrime(delay) {
      window.clearTimeout(homePrimeTimer);
      homePrimeTimer = window.setTimeout(primeNext, delay === undefined ? PRIME_DELAY : delay);
    }

    function primeNext() {
      if (!homeShown) return;
      const hosts = homeHosts();
      if (hosts.length < 2) return;
      const current = homeFrameAt(slideIndex);
      if (current && current.dataset.started !== "1" && current.dataset.failed !== "1") {
        scheduleHomePrime(800);
        return;
      }
      const next = (slideIndex + 1) % hosts.length;
      if (next === homePending) return;
      mountHome(hosts[next], "prime");
    }

    function commitSlide(target) {
      if (target !== homePending) return;
      window.clearTimeout(homeSwitchTimer);
      homePending = -1;
      const first = !homeStarted;
      homeStarted = true;
      slideIndex = target;

      document.querySelectorAll("#home .slide").forEach((slide, n) => {
        slide.classList.toggle("on", n === slideIndex);
      });
      document.querySelectorAll("#counter button").forEach((button, n) => {
        button.classList.toggle("on", n === slideIndex);
      });
      const current = homeWorks()[slideIndex];
      if (current) setCaption(current.work, first);
      if (!homeFrameAt(slideIndex)) resolveFirstLive();

      startProgress();
      window.clearTimeout(homeTrimTimer);
      homeTrimTimer = window.setTimeout(trimHome, 1300);
      scheduleHomePrime();
    }

    function goSlide(target) {
      const hosts = homeHosts();
      if (!hosts.length) return;
      target = ((target % hosts.length) + hosts.length) % hosts.length;
      window.clearTimeout(homeSwitchTimer);
      if (homeStarted && target === slideIndex) {
        homePending = -1;
        return;
      }
      homePending = target;
      const frame = homeShown ? mountHome(hosts[target], "play") : null;
      if (!homeStarted || !frame || frame.dataset.playing === "1") {
        commitSlide(target);
        return;
      }
      homeSwitchTimer = window.setTimeout(() => commitSlide(target), SWITCH_WAIT);
    }

    function refreshHome() {
      homePending = -1;
      window.clearTimeout(homeSwitchTimer);
      homeHosts().forEach(unmountHome);
      if (!homeShown) return;
      mountHome(homeHosts()[slideIndex], "play");
      scheduleHomePrime();
    }

    function paintProgress(ratio) {
      const bar = document.getElementById("progress");
      if (!bar) return;
      bar.querySelectorAll("span").forEach((seg, n) => {
        seg.classList.toggle("done", n < slideIndex);
        seg.classList.toggle("on", n === slideIndex);
        if (n === slideIndex) seg.style.setProperty("--p", (ratio * 100) + "%");
      });
    }

    function tick(now) {
      if (showPaused) return;
      const delta = Math.min(100, Math.max(0, now - lastTick));
      lastTick = now;
      if (currentPlaying()) elapsed += delta;
      const ratio = Math.min(1, elapsed / SLIDE_DURATION);
      paintProgress(ratio);
      if (ratio >= 1 && homePending < 0) goSlide(slideIndex + 1);
      rafId = requestAnimationFrame(tick);
    }

    function startProgress() {
      cancelAnimationFrame(rafId);
      elapsed = 0;
      lastTick = performance.now();
      paintProgress(0);
      if (!showPaused) rafId = requestAnimationFrame(tick);
    }

    function pauseShow() {
      showPaused = true;
      homeShown = false;
      cancelAnimationFrame(rafId);
      window.clearTimeout(homePrimeTimer);
      window.clearTimeout(homeSwitchTimer);
      homePending = -1;
      homeHosts().forEach((host) => {
        const frame = host.querySelector("iframe");
        if (!frame) return;
        window.clearTimeout(frame._startTimer);
        window.clearTimeout(frame._stallTimer);
        setHomeWant(frame, "pause");
      });
      if (playerOpen) {
        document.querySelectorAll(".view:not(#home) .media").forEach(releaseMedia);
      }
    }

    function resumeShow() {
      if (playerOpen || document.hidden) return;
      const onHome = document.getElementById("home").classList.contains("active");
      if (!onHome) return;
      showPaused = false;
      homeShown = true;
      cancelAnimationFrame(rafId);
      if (!homeStarted) {
        goSlide(0);
        return;
      }
      mountHome(homeHosts()[slideIndex], "play");
      scheduleHomePrime();
      lastTick = performance.now();
      rafId = requestAnimationFrame(tick);
    }

        ["name", t("Name"), "text", true],

          status.className = "contact-status bad";
          status.textContent = t("An error occurred. Please try again later.");
        }

        status.hidden = false;
        button.disabled = false;
        button.textContent = t("Send message");

          status.hidden = true;
        }, 5000);
      });

      split.appendChild(form);
      page.appendChild(split);
      section.appendChild(page);
      app.appendChild(section);
    }

    function openPlayer(work, index) {
      const screen = document.getElementById("player-screen");
      emptyScreen();
      const id = youtubeId(work.youtube);
      const list = id ? "" : youtubeList(work.youtube);
      const portrait = phoneQuery.matches && Boolean(work.vimeoMobile);
      const parts = vimeoParts(chosenVimeo(work));
      const vimeo = parts ? parts.id : "";
      screen.classList.toggle("is-portrait", portrait && Boolean(vimeo));

      if (id || list) {
        const iframe = document.createElement("iframe");
        iframe.referrerPolicy = "strict-origin-when-cross-origin";
        iframe.src = id
          ? "https://www.youtube-nocookie.com/embed/" + id + "?autoplay=1&rel=0&modestbranding=1&playsinline=1"
          : "https://www.youtube-nocookie.com/embed/videoseries?list=" + encodeURIComponent(list) + "&autoplay=1&rel=0&modestbranding=1&playsinline=1";
        iframe.allow = "autoplay; fullscreen; picture-in-picture";
        iframe.allowFullscreen = true;
        iframe.title = labelOf(work);
        screen.appendChild(iframe);
      } else if (vimeo) {
        const iframe = vimeoFrame(parts, "player");
        iframe.dataset.want = "play";
        iframe.title = labelOf(work);
        screen.appendChild(iframe);
      } else if (work.full || work.video) {
        const video = document.createElement("video");
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        if (work.poster) video.poster = work.poster;
        video.src = work.full || work.video;
        screen.appendChild(video);
        video.play().catch(() => {});
      } else {
        screen.appendChild(placeholder(index));
      }

      document.getElementById("player-title").textContent = labelOf(work);
      const who = work.creditName || work.role || directorName(work.dir);
      const stamp = work.madeFor || work.year;
      const note = work.line || work.credit;
      const bits = [who, stamp, note].filter(Boolean);
      const sub = document.getElementById("player-sub");
      sub.innerHTML = "";
      if (!work.creditName && !work.role && work.dir && DIRECTORS.some((d) => d.id === work.dir)) {
        const link = document.createElement("a");
        link.href = "#" + work.dir;
        link.textContent = directorName(work.dir);
        link.addEventListener("click", () => closePlayer());
        sub.appendChild(link);
        const rest = [work.madeFor || work.year, work.credit].filter(Boolean);
        if (rest.length) sub.appendChild(document.createTextNode(" · " + rest.join(" · ")));
      } else {
        sub.textContent = bits.join(" · ");
      }

      player.inert = false;
      player.classList.add("open");
      playerOpen = true;
      pauseShow();
      document.getElementById("player-close").focus();
    }

    function closePlayer() {
      if (!playerOpen) return;
      player.classList.remove("open");
      player.inert = true;
      playerOpen = false;
      const screen = document.getElementById("player-screen");
      screen.classList.remove("is-portrait");
      emptyScreen();
      resumeShow();
      const active = document.querySelector(".view.active");
      if (active && active.id !== "home") settleMedia(active);
    }

    /* ---------- Routeur ---------- */

    function hashIsKnown(hash) {
      if (!hash || hash === "home" || hash === "contact" || hash === "about") return true;
      if (DIRECTORS.some((d) => d.id === hash)) return true;
      return Object.keys(TYPES).some((type) => TYPES[type].hash === hash && worksOfType(type).length);
    }

    function settleMedia(section) {
      if (!section || section.id === "home") return;
      section.querySelectorAll(".bg").forEach((bg) => {
        const host = bg.querySelector(".media");
        if (bg.classList.contains("on")) activateMedia(host, "background");
        else releaseMedia(host);
      });
      section.querySelectorAll(".hero .media").forEach((host) => activateMedia(host, "background"));
      section.querySelectorAll(".tile .media").forEach(releaseMedia);
    }

    function route() {
      const raw = location.hash.replace("#", "");
      if (!hashIsKnown(raw)) {
        location.hash = "home";
        return;
      }
      const hash = raw || "home";
      closeMenu();
      document.querySelectorAll(".view").forEach((view) => {
        const on = view.id === hash;
        view.classList.toggle("active", on);
        view.hidden = !on;
        view.inert = !on;
      });
      document.querySelectorAll("[data-nav]").forEach((link) => {
        link.classList.toggle("active", link.getAttribute("href") === "#" + hash);
      });
      window.scrollTo(0, 0);
      document.querySelectorAll(".view:not(.active):not(#home) .media").forEach(releaseMedia);

      if (hash === "home") resumeShow();
      else {
        pauseShow();
        settleMedia(document.getElementById(hash));
      }
    }

    function loadImage(src) {
      return new Promise((resolve) => {
        const image = new Image();
        image.onload = () => resolve();
        image.onerror = () => resolve();
        image.src = src;
      });
    }

    function delay(ms) {
      return new Promise((resolve) => window.setTimeout(resolve, ms));
    }

    function runBoot() {
      const lines = [
        [0, t("Initializing Timeline")],
        [20, t("Loading Assets")],
        [40, t("Rendering Sequences")],
        [60, t("Processing Media")],
        [80, t("Finalizing Project")],
        [95, t("Ready")]
      ];
      const bar = document.getElementById("boot-bar");
      const head = document.getElementById("boot-head");
      const pct = document.getElementById("boot-pct");
      const msg = document.getElementById("boot-msg");
      const started = performance.now();
      let target = 0;
      let shown = 0;
      let painting = true;

      function paint() {
        if (!painting) return;
        shown += (target - shown) * 0.16;
        if (target >= 1 && shown > 0.992) shown = 1;
        const value = Math.round(shown * 100);
        bar.style.width = (shown * 100) + "%";
        head.style.left = (shown * 100) + "%";
        pct.textContent = value + "%";
        const line = lines.filter((item) => value >= item[0]).pop();
        if (line) msg.textContent = line[1];
        if (shown < 1) requestAnimationFrame(paint);
        else painting = false;
      }
      requestAnimationFrame(paint);

      // Le chargement attend les images et la première vidéo de l'accueil,
      // déjà en lecture derrière l'écran de chargement.
      const images = ["assets/logo.png", ABOUT.logo].concat(ABOUT.gallery, ABOUT.clients);
      const onHome = document.getElementById("home").classList.contains("active");
      const total = images.length + (onHome ? 3 : 0);
      let done = 0;
      const bump = (weight) => {
        done += weight || 1;
        target = Math.min(0.97, done / total);
      };

      const pictures = Promise.all(images.map((src) => Promise.race([loadImage(src), delay(6000)]).then(() => bump())));
      const video = onHome ? Promise.race([firstLive, delay(10000)]).then(() => bump(3)) : Promise.resolve();

      return Promise.all([pictures, video]).then(() => {
        target = 1;
        const elapsed = performance.now() - started;
        return delay(Math.max(0, 900 - elapsed) + 280);
      });
    }

    async function init() {
      const bare = location.pathname.replace(/^\/+|\/+$/g, "");
      if (bare && bare !== "index.html" && !location.hash) {
        const alias = bare === "projects" ? "music-video" : bare;
        if (hashIsKnown(alias)) {
          location.replace("/#" + alias);
          return;
        }
      }

      renderNav();
      setupLanguage();
      renderHome();
      renderCategory("pub");
      renderCategory("clip");
      renderCategory("show");
      renderCategory("contenu");
      DIRECTORS.forEach(renderDirector);
      renderAbout();
      renderContact();

      document.getElementById("open-menu").addEventListener("click", openMenu);
      document.getElementById("close-menu").addEventListener("click", closeMenu);
      document.getElementById("player-close").addEventListener("click", closePlayer);
      overlay.addEventListener("click", (event) => {
        if (event.target.closest("a")) closeMenu();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        if (overlay.classList.contains("open")) closeMenu();
        else closePlayer();
      });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) pauseShow();
        else resumeShow();
      });
      window.addEventListener("hashchange", route);
      window.addEventListener("hashchange", updateLangLinks);
      if (phoneQuery.addEventListener) phoneQuery.addEventListener("change", syncVimeoFrames);
      else phoneQuery.addListener(syncVimeoFrames);
      attachVimeoBridge();

      // La page s'affiche sous l'écran de chargement : la première vidéo
      // démarre tout de suite et tourne déjà quand le rideau se lève.
      route();
      await runBoot();
      const boot = document.getElementById("boot");
      boot.classList.add("done");
      window.setTimeout(() => {
        boot.hidden = true;
      }, 650);
    }

    init().catch(() => {
      if (!document.querySelector(".view.active")) route();
      const boot = document.getElementById("boot");
      boot.classList.add("done");
      boot.hidden = true;
    });
  </script>
</body>
</html>
